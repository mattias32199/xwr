# --device AWR1843 --rsp AWR1843AOP
# config for ^

# This can be passed to `AWRSystem` by simply unpacking:
# system = AWRSystem(**config)
radar:  # -> AWRConfig
  port: null  # auto-detect
  frequency: 77.0 # (default=77.0)
  idle_time: 7.0 # (default=200.0)
  adc_start_time: 5.7 # keep
  ramp_end_time: 59.00 # (default=59.00)
  tx_start_time: 1.0 # keep
  freq_slope: 67.012 # 67.012
  adc_samples: 128 # keep
  sample_rate: 2500 # default=(2500)
  frame_length: 128 # keep
  frame_period: 100.0 # affects fps (default=125.0)

capture:  # -> DCAConfig (fixed)
  sys_ip: 192.168.33.30
  fpga_ip: 192.168.33.180
  data_port: 4098
  config_port: 4096
